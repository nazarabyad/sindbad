<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12263A">
<meta name="robots" content="noindex">
<title>سندباد - الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--ink:#12263A;--sea:#0E7C86;--foam:#EAF2F3;--sun:#F2A93B;--mut:#5d6f7d;--bad:#b3261e}
*{box-sizing:border-box;margin:0}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--foam);color:var(--ink);min-height:100vh}
header{background:var(--ink);color:#fff;padding:18px 18px 26px;border-radius:0 0 26px 26px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:26px;font-weight:800}header p{color:#b9cad6;font-size:14px}
header button{width:auto;padding:8px 16px;background:#ffffff22;color:#fff;margin:0}
main{padding:14px;margin-top:-12px;max-width:560px;margin-inline:auto}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(18,38,58,.08);line-height:1.7}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input{width:100%;padding:12px;border:1.5px solid #cfdbe0;border-radius:12px;font:inherit;background:#fff;margin-bottom:10px}
input:focus{outline:3px solid rgba(14,124,134,.35)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px;width:100%;font-weight:700;margin-top:8px}
.go{background:var(--sun);color:var(--ink)}
.ok{background:var(--sea);color:#fff}
.no{background:#f6d6d3;color:var(--bad)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{margin:0;background:#fff;color:var(--ink);padding:10px 2px;font-size:13px}
.tabs button.on{background:var(--ink);color:#fff}
.sw{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:14px}
.tag{font-size:12px;padding:3px 10px;border-radius:99px;background:#cfdbe0;white-space:nowrap}
.tag.g{background:#d3efe3;color:#0c5a3a}.tag.r{background:#f6d6d3;color:var(--bad)}
.err{color:var(--bad);font-size:14px;margin-top:6px}
.hide{display:none}
select{width:100%;padding:12px;border:1.5px solid #cfdbe0;border-radius:12px;font:inherit;background:#fff;margin-bottom:10px}
#map{z-index:0}
</style>
</head>
<body>
<header><div><h1>سندباد</h1><p>لوحة الإدارة • أبو حمد • v19</p></div><button id="out" class="hide">خروج</button></header>
<main>
  <section id="login" class="card hide">
    <label for="em">الإيميل</label><input id="em" type="email" autocomplete="username">
    <label for="pw">كلمة السر</label><input id="pw" type="password" autocomplete="current-password">
    <button class="go" id="lb">دخول</button><div class="err" id="er"></div>
  </section>

  <section id="panel" class="hide">
    <div class="tabs">
      <button data-t="pay" class="on">الدفعات <span id="pc"></span></button>
      <button data-t="drv">السواق</button>
      <button data-t="rid">المشاوير</button>
      <button data-t="plc">الأماكن</button>
      <button data-t="prcw">الأسعار</button>
    </div>
    <div id="pay"></div>
    <div id="drv" class="hide"><input id="q" placeholder="ابحث بالاسم أو الرقم"><div id="dl"></div></div>
    <div id="rid" class="hide"></div>
    <div id="prcw" class="hide"><div id="prc"></div></div>
    <div id="plc" class="hide">
      <div class="card"><b>استيراد من الخريطة العامة</b>
        <div class="mut">يجلب الأحياء والمطاعم والمستشفيات والأسواق وغيرها المسجلة في أبو حمد، وتختار شنو تحفظ.</div>
        <button class="go" id="rep">استبدال كل الأماكن بأماكن أبو حمد (بضغطة)</button>
        <button class="ok" id="imp">جلب الأماكن من الخريطة</button><div id="il" style="margin-top:8px"></div>
        <button class="no" id="clr">مسح الأماكن المستوردة القديمة</button>
      </div>
      <div class="card">
        <div id="map" style="height:260px;border-radius:12px"></div>
        <div class="mut" id="ph" style="margin:8px 0">اضغط على الخريطة في مكان الحي أو المطعم</div>
        <input id="pn" placeholder="اسم المكان">
        <select id="pcat"><option value="hood">حي</option><option value="food">مطعم</option><option value="health">مستشفى/صحة</option><option value="market">سوق</option><option value="other">مكان آخر</option></select>
        <button class="ok" id="pa">إضافة المكان</button>
      </div>
      <input id="pq" placeholder="ابحث في الأماكن المضافة"><div id="pl"></div>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,onSnapshot,query,where,orderBy,limit,writeBatch,updateDoc,addDoc,deleteDoc,setDoc,Timestamp,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyBmZP_ZaIOUiZeexQmtPlYVJENJYIk3iME",
  authDomain:"sindbad-13df0.firebaseapp.com",
  projectId:"sindbad-13df0",
  storageBucket:"sindbad-13df0.firebasestorage.app",
  messagingSenderId:"1088403371161",
  appId:"1:1088403371161:web:79fc720b3287ab77627408"
});
const auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const VN={car:"صالون",dafar:"دفار",box:"بوكس",rickshaw:"ركشة",bike:"موتر"},ST={pending:"بانتظار",accepted:"مقبول",done:"تم",cancelled:"ملغي"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fd=t=>t&&t.toMillis?new Date(t.toMillis()).toLocaleDateString("en-GB"):"—";
const num=n=>Number(n||0).toLocaleString("en-US");
let drivers=[],pays=[],rides=[],places=[],unsubs=[],map=null,pt=null,mk=null;

onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f());unsubs=[];
  const bad=!u||u.isAnonymous||(u.email||"").endsWith("@sindbad.invalid");
  if(u&&bad){$("er").textContent="هذا الحساب ليس حساب إدارة";signOut(auth);return}
  $("login").classList.toggle("hide",!bad);$("panel").classList.toggle("hide",bad);$("out").classList.toggle("hide",bad);
  if(!bad)start();
});
$("lb").onclick=async()=>{
  $("er").textContent="";
  try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value)}
  catch(e){$("er").textContent="الإيميل أو كلمة السر غلط"}
};
$("out").onclick=()=>signOut(auth);

function start(){
  const fail=()=>{$("pay").innerHTML='<div class="card err">تعذر تحميل البيانات. تأكد من الإنترنت.</div>'};
  unsubs.push(onSnapshot(collection(db,"drivers"),s=>{drivers=s.docs.map(d=>({id:d.id,...d.data()}));rDrv();rPay()},fail));
  unsubs.push(onSnapshot(query(collection(db,"payments"),where("status","==","pending")),s=>{
    pays=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt?.toMillis?.()||0)-(b.createdAt?.toMillis?.()||0));rPay();
  },fail));
  unsubs.push(onSnapshot(query(collection(db,"rides"),orderBy("createdAt","desc"),limit(20)),s=>{rides=s.docs.map(d=>({id:d.id,...d.data()}));rRid()},fail));
  unsubs.push(onSnapshot(collection(db,"places"),s=>{places=s.docs.map(d=>({id:d.id,...d.data()}));rPlc()},fail));
  unsubs.push(onSnapshot(doc(db,"settings","pricing"),s=>{prc=s.exists()?s.data():{};rPrice()}));
  unsubs.push(onSnapshot(doc(db,"settings","payment"),s=>{pay0=s.exists()?s.data():{};rPrice()}));
}

function rPay(){
  $("pc").textContent=pays.length?"("+pays.length+")":"";
  $("pay").innerHTML=pays.length?pays.map(p=>{
    const d=drivers.find(x=>x.id===p.driverId)||{};
    return `<div class="card"><div class="sw"><b>${esc(p.driverName)}</b><span class="mut" dir="ltr">${esc(p.driverPhone)}</span></div>
    <div class="mut">${VN[d.vehicleType]||""}${d.carModel?" "+esc(d.carModel):""} • لوحة ${esc(d.plate)}</div>
    <div>المبلغ: <b>${num(p.amount)}</b> جنيه</div>
    <div>رقم العملية: <b dir="ltr">${esc(p.ref)}</b></div>
    <div>المحوِّل: ${esc(p.payerName)} <span class="mut">• ${fd(p.createdAt)}</span></div>
    <button class="ok" data-a="ok" data-id="${p.driverId}" data-p="${p.id}">تأكيد وتفعيل 30 يوم</button>
    <button class="no" data-a="no" data-p="${p.id}">رفض</button></div>`}).join(""):'<div class="card mut">ما في دفعات معلقة</div>';
}
function rDrv(){
  const q=$("q").value.trim();
  const l=drivers.filter(d=>!q||(d.name||"").includes(q)||(d.phone||"").includes(q));
  $("dl").innerHTML=l.map(d=>{
    const exp=d.paidUntil&&d.paidUntil.toMillis()<Date.now(),st=!d.active?"غير مفعّل":exp?"منتهي":"مفعّل";
    return `<div class="card"><div class="sw"><b>${esc(d.name)}</b><span class="tag ${st==="مفعّل"?"g":"r"}">${st==="مفعّل"&&d.trial?"تجربة مجانية":st}</span></div>
    <div class="mut"><span dir="ltr">${esc(d.phone)}</span> • ${VN[d.vehicleType]||""}${d.carModel?" "+esc(d.carModel):""} • لوحة ${esc(d.plate)}</div>
    <div class="mut">ينتهي: ${fd(d.paidUntil)}${d.online?" • متاح الآن":""}</div>
    <button class="ok" data-a="act" data-id="${d.id}">تفعيل / تجديد 30 يوم</button>
    ${d.active?`<button class="no" data-a="off" data-id="${d.id}">إيقاف الحساب</button>`:""}
    <button class="no" data-a="rm" data-id="${d.id}">حذف السواق نهائياً</button></div>`}).join("")||'<div class="card mut">ما في سواقين</div>';
}
function rRid(){
  $("rid").innerHTML=`<div class="card mut">آخر ${rides.length} مشوار</div>`+rides.map(r=>`<div class="card"><div class="sw"><b>${esc(r.customerName)}</b><span class="tag">${ST[r.status]||esc(r.status)}</span></div>
  <div class="mut">${VN[r.vehicleType]||""} • ${r.price?num(r.price)+" جنيه":"—"} • ${r.distanceKm||"—"} كم</div>
  <div class="mut">الوجهة: ${esc(r.destination)}${r.driverName?" • السواق: "+esc(r.driverName):""}</div></div>`).join("");
}
const CITY={n:"أبو حمد",c:[19.5402,33.3252],b:[[19.46,33.24],[19.62,33.42]]};
const CAT={hood:"حي",food:"مطعم",health:"صحة",market:"سوق",other:"مكان آخر"};
function rPlc(){
  const q=$("pq").value.trim();
  const all=places.filter(p=>!q||String(p.name).includes(q)).sort((a,b)=>String(a.name).localeCompare(String(b.name),"ar")),l=all.slice(0,60);
  $("pl").innerHTML=(all.length>60?`<div class="card mut">عرض أول 60 من ${all.length}. استخدم البحث.</div>`:"")+l.map(p=>`<div class="card"><div class="sw"><b>${esc(p.name)}</b><span class="tag">${CAT[p.cat]||""}</span></div><button class="no" data-a="del" data-id="${p.id}">حذف</button></div>`).join("")||'<div class="card mut">ما في أماكن مضافة لسه</div>';
}
function initMap(){
  if(!window.L)return;
  if(!map){
    map=L.map("map",{maxBounds:CITY.b,minZoom:11}).setView(CITY.c,14);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
    map.on("click",e=>{pt=e.latlng;if(mk)mk.setLatLng(e.latlng);else mk=L.marker(e.latlng).addTo(map);$("ph").textContent="تم اختيار الموقع، اكتب الاسم واضغط إضافة"});
  }
  setTimeout(()=>map.invalidateSize(),150);
}
$("pa").onclick=async()=>{
  const name=$("pn").value.trim();
  if(!pt||name.length<2){alert("اضغط على الخريطة واكتب اسم المكان");return}
  try{await addDoc(collection(db,"places"),{name,cat:$("pcat").value,lat:pt.lat,lng:pt.lng,createdAt:serverTimestamp()});$("pn").value="";$("ph").textContent="تمت الإضافة. اختار مكان تاني على الخريطة"}
  catch(e){alert("فشلت الإضافة، حاول تاني")}
};
const IC={hood:"أحياء",food:"مطاعم وكافيهات",health:"مستشفيات وعيادات وصيدليات",market:"أسواق",other:"أماكن عامة (مدارس، بنوك، فنادق، مساجد...)"};
let found=[];
function catOf(t){
  if(t.place)return"hood";
  const a=t.amenity;
  if(["restaurant","cafe","fast_food"].includes(a))return"food";
  if(["hospital","clinic","doctors","pharmacy"].includes(a))return"health";
  if(a==="marketplace"||t.shop)return"market";
  return"other";
}
async function osmFetch(){
  const B=CITY.b[0][0]+","+CITY.b[0][1]+","+CITY.b[1][0]+","+CITY.b[1][1];
  const q=`[out:json][timeout:50];(nwr["place"~"^(suburb|neighbourhood|quarter|village|hamlet|locality)$"]["name"](${B});nwr["amenity"~"^(restaurant|cafe|fast_food|hospital|clinic|doctors|pharmacy|school|college|university|bank|marketplace|bus_station|fuel|place_of_worship)$"]["name"](${B});nwr["shop"~"^(mall|supermarket)$"]["name"](${B});nwr["tourism"~"^(hotel|guest_house)$"]["name"](${B});nwr["leisure"~"^(stadium|park)$"]["name"](${B}););out center tags;`;
  for(const ep of ["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"]){
    try{const r=await fetch(ep,{method:"POST",body:"data="+encodeURIComponent(q)});if(!r.ok)continue;return await r.json()}catch(e){}
  }
  return null;
}
function osmItems(data,skip){
  const seen=new Set();
  return data.elements.map(e=>{
    const t=e.tags||{},name=(t["name:ar"]||t.name||"").trim(),lat=e.lat??(e.center&&e.center.lat),lng=e.lon??(e.center&&e.center.lon);
    if(!name||lat==null||lng==null)return null;
    const id="osm_"+e.type+e.id,cat=catOf(t),key=cat+"|"+name;
    if(skip.has(id)||seen.has(key))return null;
    seen.add(key);return{id,name,cat,lat,lng};
  }).filter(Boolean);
}
async function putAll(list){
  for(let i=0;i<list.length;i+=400){
    const w=writeBatch(db);
    list.slice(i,i+400).forEach(f=>w.set(doc(db,"places",f.id),{name:f.name,cat:f.cat,lat:f.lat,lng:f.lng,source:"osm",createdAt:serverTimestamp()}));
    await w.commit();
  }
}
$("imp").onclick=async()=>{
  $("il").innerHTML='<div class="mut">جاري الجلب من الخريطة... ممكن ياخد نص دقيقة</div>';
  const data=await osmFetch();
  if(!data){$("il").innerHTML='<div class="err">تعذر الجلب من الخريطة. جرّب تاني بعد شوية.</div>';return}
  found=osmItems(data,new Set(places.map(p=>p.id)));
  rImp();
};
$("rep").onclick=async()=>{
  if(!confirm("بيمسح كل الأماكن الحالية (حتى اللي ضفتها بيدك) ويجيب بدلها أحياء ومطاعم ومستشفيات وأسواق أبو حمد من الخريطة. تكمل؟"))return;
  $("il").innerHTML='<div class="mut">جاري الجلب من الخريطة... ممكن ياخد نص دقيقة</div>';
  const data=await osmFetch();
  if(!data){$("il").innerHTML='<div class="err">تعذر الجلب من الخريطة. ما مسحنا شي، جرّب تاني بعد شوية.</div>';return}
  const list=osmItems(data,new Set()).filter(f=>f.cat!=="other");
  if(!list.length){$("il").innerHTML='<div class="err">الخريطة ما رجّعت أماكن لأبو حمد. ما مسحنا شي. ضيف الأماكن بيدك من الخريطة تحت.</div>';return}
  try{
    const old=places.slice();
    for(let i=0;i<old.length;i+=400){const w=writeBatch(db);old.slice(i,i+400).forEach(p=>w.delete(doc(db,"places",p.id)));await w.commit()}
    await putAll(list);
    $("il").innerHTML='<div class="mut">تم: مسحنا '+old.length+' مكان قديم وحفظنا '+list.length+' مكان من أبو حمد ✓</div>';
  }catch(e){alert("فشلت العملية، حاول تاني")}
};
function rImp(){
  const g={};found.forEach(f=>(g[f.cat]=g[f.cat]||[]).push(f));
  $("il").innerHTML=found.length?Object.keys(IC).filter(k=>g[k]).map(k=>`<div class="card" style="box-shadow:none;background:var(--foam)"><label style="display:flex;gap:8px;align-items:center;margin:0;color:var(--ink)"><input type="checkbox" class="ic" data-k="${k}" ${k==="other"?"":"checked"} style="width:auto;margin:0"><b>${IC[k]} (${g[k].length})</b></label><div class="mut">${g[k].slice(0,6).map(x=>esc(x.name)).join("، ")}${g[k].length>6?"…":""}</div></div>`).join("")+'<button class="ok" id="isv">حفظ الأقسام المحددة</button>':'<div class="mut">ما لقينا أماكن جديدة.</div>';
  if($("isv"))$("isv").onclick=saveImp;
}
async function saveImp(){
  const keys=[...document.querySelectorAll(".ic:checked")].map(x=>x.dataset.k),list=found.filter(f=>keys.includes(f.cat));
  if(!list.length){alert("اختار قسم واحد على الأقل");return}
  if(!confirm("حفظ "+list.length+" مكان؟"))return;
  try{
    for(let i=0;i<list.length;i+=400){
      const w=writeBatch(db);
      list.slice(i,i+400).forEach(f=>w.set(doc(db,"places",f.id),{name:f.name,cat:f.cat,lat:f.lat,lng:f.lng,source:"osm",createdAt:serverTimestamp()}));
      await w.commit();
    }
    $("il").innerHTML='<div class="mut">تم حفظ '+list.length+' مكان ✓</div>';found=[];
  }catch(e){alert("فشل الحفظ، حاول تاني")}
}
$("clr").onclick=async()=>{
  const old=places.filter(p=>p.source==="osm");
  if(!old.length){alert("ما في أماكن مستوردة");return}
  if(!confirm("مسح "+old.length+" مكان مستورد؟ الأماكن اللي ضفتها بيدك ما بتتمسح."))return;
  try{for(let i=0;i<old.length;i+=400){const w=writeBatch(db);old.slice(i,i+400).forEach(p=>w.delete(doc(db,"places",p.id)));await w.commit()}}
  catch(e){alert("فشل المسح، حاول تاني")}
};
$("pq").oninput=rPlc;
const TY=[["car","صالون","Car"],["dafar","دفار","Dafar"],["box","بوكس","Box"],["rickshaw","ركشة","Rickshaw"],["bike","موتر","Bike"]];
const DK={car:6000,rickshaw:4000,bike:2000},DS={car:100000,rickshaw:50000,bike:20000};
let prc={},pay0={};
function rPrice(){
  const ae=document.activeElement;
  if(ae&&ae.closest&&ae.closest("#prc"))return;
  const v=x=>x==null?"":x;
  $("prc").innerHTML=`<div class="card mut">أول كيلو بسعر ثابت، وبعدو كل كيلو بسعر الكيلو. السعر بيتقرب لأقرب 500 جنيه. التغيير بيطبق على الزبائن بعد ما يعيدوا فتح التطبيق.</div>`+TY.map(([k,n,C])=>`<div class="card"><b>${n}</b>
    <label>الكيلو الأول (ثابت)</label><input type="number" inputmode="numeric" id="b_${k}" value="${v(prc["base"+C]??10000)}">
    <label>سعر الكيلو بعد الأول</label><input type="number" inputmode="numeric" id="k_${k}" value="${v(prc["priceKm"+C]??DK[k])}">
    <label>الاشتراك الشهري</label><input type="number" inputmode="numeric" id="s_${k}" value="${v(pay0["price"+C]??DS[k])}"></div>`).join("")+`<div class="card">
    <label>أيام التجربة المجانية للسواق الجديد</label><input type="number" inputmode="numeric" id="trd" value="${v(pay0.trialDays??15)}">
    <label>رقم حساب بنكك</label><input id="bka" value="${esc(pay0.bankAccount||"")}">
    <label>اسم صاحب الحساب</label><input id="bkh" value="${esc(pay0.holderName||"")}">
    <button class="go" id="psave">حفظ الأسعار</button></div>`;
  $("psave").onclick=savePrices;
}
async function savePrices(){
  const n=id=>{const t=$(id).value.trim();return t===""?null:Number(t)};
  const pr={},py={};
  TY.forEach(([k,,C])=>{
    const b=n("b_"+k),kk=n("k_"+k),s=n("s_"+k);
    if(b!=null&&b>=0)pr["base"+C]=b;
    if(kk!=null&&kk>=0)pr["priceKm"+C]=kk;
    if(s!=null&&s>=0)py["price"+C]=s;
  });
  const t=n("trd");if(t!=null&&t>=0)py.trialDays=t;
  py.bankAccount=$("bka").value.trim();py.holderName=$("bkh").value.trim();
  try{
    await setDoc(doc(db,"settings","pricing"),pr,{merge:true});
    await setDoc(doc(db,"settings","payment"),py,{merge:true});
    alert("تم حفظ الأسعار ✓");
  }catch(e){alert("فشل الحفظ، حاول تاني")}
}
$("q").oninput=rDrv;

document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  ["pay","drv","rid","plc","prcw"].forEach(t=>$(t).classList.toggle("hide",t!==b.dataset.t));
  if(b.dataset.t==="plc")initMap();
});

$("panel").onclick=async e=>{
  const b=e.target.closest("button[data-a]");if(!b)return;
  const a=b.dataset.a,id=b.dataset.id,p=b.dataset.p;
  try{
    if(a==="ok"||a==="act"){
      if(!confirm(a==="ok"?"تأكدت إنو المبلغ وصل في بنكك؟":"تفعيل الحساب لمدة 30 يوم؟"))return;
      const d=drivers.find(x=>x.id===id);
      const base=Math.max(Date.now(),d&&d.active&&d.paidUntil?d.paidUntil.toMillis():0);
      const w=writeBatch(db);
      w.update(doc(db,"drivers",id),{active:true,trial:false,paidUntil:Timestamp.fromMillis(base+30*864e5)});
      if(p)w.update(doc(db,"payments",p),{status:"approved",approvedAt:serverTimestamp()});
      await w.commit();
    }else if(a==="no"){
      if(confirm("رفض هذه الدفعة؟"))await updateDoc(doc(db,"payments",p),{status:"rejected"});
    }else if(a==="rm"){
      const d=drivers.find(x=>x.id===id);
      if(!confirm("حذف السواق "+(d?d.name:"")+" نهائياً؟ بيتمسح ملفو ودفعاتو المعلقة، وما بترجع."))return;
      const w=writeBatch(db);
      w.delete(doc(db,"drivers",id));w.delete(doc(db,"driverLocations",id));
      pays.filter(p=>p.driverId===id).forEach(p=>w.delete(doc(db,"payments",p.id)));
      await w.commit();
    }else if(a==="del"){
      if(confirm("حذف المكان؟"))await deleteDoc(doc(db,"places",id));
    }else if(a==="off"){
      if(confirm("إيقاف حساب السواق؟"))await updateDoc(doc(db,"drivers",id),{active:false,online:false});
    }
  }catch(err){alert("فشل التنفيذ، حاول تاني")}
};
</script>
