<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12263A">
<meta name="robots" content="noindex">
<title>سندباد - الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#12263A;--sea:#0E7C86;--foam:#EAF2F3;--sun:#F2A93B;--mut:#5d6f7d;--bad:#b3261e}
*{box-sizing:border-box;margin:0}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--foam);color:var(--ink);min-height:100vh}
header{background:var(--ink);color:#fff;padding:18px 18px 26px;border-radius:0 0 26px 26px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:26px;font-weight:800}header p{color:#b9cad6;font-size:14px}
header button{width:auto;padding:8px 16px;background:#ffffff22;color:#fff;margin:0}
main{padding:14px;margin-top:-12px;max-width:560px;margin-inline:auto}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(18,38,58,.08);line-height:1.7}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input{width:100%;padding:12px;border:1.5px solid #cfdbe0;border-radius:12px;font:inherit;background:#fff;margin-bottom:10px}
input:focus{outline:3px solid rgba(14,124,134,.35)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px;width:100%;font-weight:700;margin-top:8px}
.go{background:var(--sun);color:var(--ink)}
.ok{background:var(--sea);color:#fff}
.no{background:#f6d6d3;color:var(--bad)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{margin:0;background:#fff;color:var(--ink);padding:10px 4px;font-size:15px}
.tabs button.on{background:var(--ink);color:#fff}
.sw{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:14px}
.tag{font-size:12px;padding:3px 10px;border-radius:99px;background:#cfdbe0;white-space:nowrap}
.tag.g{background:#d3efe3;color:#0c5a3a}.tag.r{background:#f6d6d3;color:var(--bad)}
.err{color:var(--bad);font-size:14px;margin-top:6px}
.hide{display:none}
</style>
</head>
<body>
<header><div><h1>سندباد</h1><p>لوحة الإدارة</p></div><button id="out" class="hide">خروج</button></header>
<main>
  <section id="login" class="card hide">
    <label for="em">الإيميل</label><input id="em" type="email" autocomplete="username">
    <label for="pw">كلمة السر</label><input id="pw" type="password" autocomplete="current-password">
    <button class="go" id="lb">دخول</button><div class="err" id="er"></div>
  </section>

  <section id="panel" class="hide">
    <div class="tabs">
      <button data-t="pay" class="on">الدفعات <span id="pc"></span></button>
      <button data-t="drv">السواق</button>
      <button data-t="rid">المشاوير</button>
    </div>
    <div id="pay"></div>
    <div id="drv" class="hide"><input id="q" placeholder="ابحث بالاسم أو الرقم"><div id="dl"></div></div>
    <div id="rid" class="hide"></div>
  </section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,onSnapshot,query,where,orderBy,limit,writeBatch,updateDoc,Timestamp,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyBmZP_ZaIOUiZeexQmtPlYVJENJYIk3iME",
  authDomain:"sindbad-13df0.firebaseapp.com",
  projectId:"sindbad-13df0",
  storageBucket:"sindbad-13df0.firebasestorage.app",
  messagingSenderId:"1088403371161",
  appId:"1:1088403371161:web:79fc720b3287ab77627408"
});
const auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const VN={car:"عربية",rickshaw:"ركشة",bike:"موتر"},ST={pending:"بانتظار",accepted:"مقبول",done:"تم",cancelled:"ملغي"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fd=t=>t&&t.toMillis?new Date(t.toMillis()).toLocaleDateString("en-GB"):"—";
const num=n=>Number(n||0).toLocaleString("en-US");
let drivers=[],pays=[],rides=[],unsubs=[];

onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f());unsubs=[];
  const bad=!u||u.isAnonymous||(u.email||"").endsWith("@sindbad.invalid");
  if(u&&bad){$("er").textContent="هذا الحساب ليس حساب إدارة";signOut(auth);return}
  $("login").classList.toggle("hide",!bad);$("panel").classList.toggle("hide",bad);$("out").classList.toggle("hide",bad);
  if(!bad)start();
});
$("lb").onclick=async()=>{
  $("er").textContent="";
  try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value)}
  catch(e){$("er").textContent="الإيميل أو كلمة السر غلط"}
};
$("out").onclick=()=>signOut(auth);

function start(){
  const fail=()=>{$("pay").innerHTML='<div class="card err">تعذر تحميل البيانات. تأكد من الإنترنت.</div>'};
  unsubs.push(onSnapshot(collection(db,"drivers"),s=>{drivers=s.docs.map(d=>({id:d.id,...d.data()}));rDrv();rPay()},fail));
  unsubs.push(onSnapshot(query(collection(db,"payments"),where("status","==","pending")),s=>{
    pays=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt?.toMillis?.()||0)-(b.createdAt?.toMillis?.()||0));rPay();
  },fail));
  unsubs.push(onSnapshot(query(collection(db,"rides"),orderBy("createdAt","desc"),limit(20)),s=>{rides=s.docs.map(d=>({id:d.id,...d.data()}));rRid()},fail));
}

function rPay(){
  $("pc").textContent=pays.length?"("+pays.length+")":"";
  $("pay").innerHTML=pays.length?pays.map(p=>{
    const d=drivers.find(x=>x.id===p.driverId)||{};
    return `<div class="card"><div class="sw"><b>${esc(p.driverName)}</b><span class="mut" dir="ltr">${esc(p.driverPhone)}</span></div>
    <div class="mut">${VN[d.vehicleType]||""} • لوحة ${esc(d.plate)}</div>
    <div>المبلغ: <b>${num(p.amount)}</b> جنيه</div>
    <div>رقم العملية: <b dir="ltr">${esc(p.ref)}</b></div>
    <div>المحوِّل: ${esc(p.payerName)} <span class="mut">• ${fd(p.createdAt)}</span></div>
    <button class="ok" data-a="ok" data-id="${p.driverId}" data-p="${p.id}">تأكيد وتفعيل 30 يوم</button>
    <button class="no" data-a="no" data-p="${p.id}">رفض</button></div>`}).join(""):'<div class="card mut">ما في دفعات معلقة</div>';
}
function rDrv(){
  const q=$("q").value.trim();
  const l=drivers.filter(d=>!q||(d.name||"").includes(q)||(d.phone||"").includes(q));
  $("dl").innerHTML=l.map(d=>{
    const exp=d.paidUntil&&d.paidUntil.toMillis()<Date.now(),st=!d.active?"غير مفعّل":exp?"منتهي":"مفعّل";
    return `<div class="card"><div class="sw"><b>${esc(d.name)}</b><span class="tag ${st==="مفعّل"?"g":"r"}">${st}</span></div>
    <div class="mut"><span dir="ltr">${esc(d.phone)}</span> • ${VN[d.vehicleType]||""} • لوحة ${esc(d.plate)}</div>
    <div class="mut">ينتهي: ${fd(d.paidUntil)}${d.online?" • متاح الآن":""}</div>
    <button class="ok" data-a="act" data-id="${d.id}">تفعيل / تجديد 30 يوم</button>
    ${d.active?`<button class="no" data-a="off" data-id="${d.id}">إيقاف الحساب</button>`:""}</div>`}).join("")||'<div class="card mut">ما في سواقين</div>';
}
function rRid(){
  $("rid").innerHTML=`<div class="card mut">آخر ${rides.length} مشوار</div>`+rides.map(r=>`<div class="card"><div class="sw"><b>${esc(r.customerName)}</b><span class="tag">${ST[r.status]||esc(r.status)}</span></div>
  <div class="mut">${VN[r.vehicleType]||""} • ${r.price?num(r.price)+" جنيه":"—"} • ${r.distanceKm||"—"} كم</div>
  <div class="mut">الوجهة: ${esc(r.destination)}${r.driverName?" • السواق: "+esc(r.driverName):""}</div></div>`).join("");
}
$("q").oninput=rDrv;

document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  ["pay","drv","rid"].forEach(t=>$(t).classList.toggle("hide",t!==b.dataset.t));
});

$("panel").onclick=async e=>{
  const b=e.target.closest("button[data-a]");if(!b)return;
  const a=b.dataset.a,id=b.dataset.id,p=b.dataset.p;
  try{
    if(a==="ok"||a==="act"){
      if(!confirm(a==="ok"?"تأكدت إنو المبلغ وصل في بنكك؟":"تفعيل الحساب لمدة 30 يوم؟"))return;
      const d=drivers.find(x=>x.id===id);
      const base=Math.max(Date.now(),d&&d.active&&d.paidUntil?d.paidUntil.toMillis():0);
      const w=writeBatch(db);
      w.update(doc(db,"drivers",id),{active:true,paidUntil:Timestamp.fromMillis(base+30*864e5)});
      if(p)w.update(doc(db,"payments",p),{status:"approved",approvedAt:serverTimestamp()});
      await w.commit();
    }else if(a==="no"){
      if(confirm("رفض هذه الدفعة؟"))await updateDoc(doc(db,"payments",p),{status:"rejected"});
    }else if(a==="off"){
      if(confirm("إيقاف حساب السواق؟"))await updateDoc(doc(db,"drivers",id),{active:false,online:false});
    }
  }catch(err){alert("فشل التنفيذ، حاول تاني")}
};
</script>
</body>
</html>
