<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12263A">
<title>سندباد - السواق</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#12263A;--sea:#0E7C86;--foam:#EAF2F3;--sun:#F2A93B;--mut:#5d6f7d;--bad:#b3261e}
*{box-sizing:border-box;margin:0}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--foam);color:var(--ink);min-height:100vh}
header{background:var(--ink);color:#fff;padding:20px 18px 28px;border-radius:0 0 28px 28px}
header h1{font-size:28px;font-weight:800}header p{color:#b9cad6;font-size:14px}
main{padding:16px;margin-top:-14px;max-width:520px;margin-inline:auto}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(18,38,58,.08)}
h2{font-size:16px;margin-bottom:8px}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:13px;border:1.5px solid #cfdbe0;border-radius:12px;font:inherit;background:#fff}
input:focus,select:focus{outline:3px solid rgba(14,124,134,.35)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:14px;width:100%;font-weight:700}
.go{background:var(--sun);color:var(--ink);font-size:17px;margin-top:14px}
.ok{background:var(--sea);color:#fff;margin-top:10px}
.alt{background:var(--foam);color:var(--sea);margin-top:8px}
.sw{display:flex;justify-content:space-between;align-items:center}
.sw b{font-size:18px}
.tg{width:auto;padding:12px 22px;background:#cfdbe0;color:var(--ink)}
.tg.on{background:var(--sea);color:#fff}
.dist{color:var(--sea);font-weight:800}
.mut{color:var(--mut);font-size:14px}
.err{color:var(--bad);font-size:14px;margin-top:8px}
.hide{display:none}
a.btn{display:block;text-align:center;background:var(--sea);color:#fff;text-decoration:none;border-radius:12px;padding:13px;font-weight:700;margin-top:8px}
a.btn.l{background:var(--foam);color:var(--sea)}
</style>
</head>
<body>
<header><h1>سندباد</h1><p>تطبيق السواق</p></header>
<main>
  <section id="auth" class="card hide">
    <h2 id="at">دخول السواق</h2>
    <div id="rg" class="hide">
      <label for="an">الاسم</label><input id="an">
      <label for="av">نوع المركبة</label>
      <select id="av"><option value="car">صالون</option><option value="dafar">دفار</option><option value="box">بوكس</option><option value="rickshaw">ركشة</option><option value="bike">موتر</option></select>
      <div id="mdl"><label for="md">نوع الصالون</label><select id="md"><option>كلك</option><option>فيرنا</option><option>أتس</option><option>أخرى</option></select></div>
    </div>
    <label for="ap">رقم الهاتف</label><input id="ap" type="tel" inputmode="tel" placeholder="09XXXXXXXX">
    <div id="rg2" class="hide"><label for="al">رقم اللوحة</label><input id="al"></div>
    <label for="aw">كلمة السر (6 أحرف أو أرقام على الأقل)</label><input id="aw" type="password" autocomplete="current-password">
    <button class="go" id="ab">دخول</button>
    <button class="alt" id="am">ما عندي حساب، سجّل جديد</button>
    <div class="err" id="e0"></div>
  </section>

  <section id="reg" class="card hide">
    <h2>كمّل بيانات حسابك</h2>
    <label for="nm">الاسم</label><input id="nm">
    <label for="ph">رقم التلفون</label><input id="ph" type="tel" inputmode="tel" placeholder="09XXXXXXXX">
    <label for="vt">نوع المركبة</label>
    <select id="vt"><option value="car">صالون</option><option value="dafar">دفار</option><option value="box">بوكس</option><option value="rickshaw">ركشة</option><option value="bike">موتر</option></select>
    <label for="pl">رقم اللوحة</label><input id="pl">
    <button class="go" id="regb">تسجيل</button><div class="err" id="e1"></div>
  </section>

  <section id="wait" class="card hide">
    <h2 id="wt">اشتراكك غير مفعّل</h2>
    <p class="mut" id="wm"></p>
    <div id="pay">
      <p style="margin-top:10px">حوّل <b id="pr">—</b> عبر <b>بنكك</b> إلى:</p>
      <div class="card" style="background:var(--foam);box-shadow:none;margin-top:8px"><b id="ba" style="font-size:20px;direction:ltr;display:block;text-align:center">—</b><div class="mut" id="bh" style="text-align:center"></div></div>
      <label for="rf">رقم العملية</label><input id="rf" inputmode="numeric">
      <label for="pn">اسم المحوِّل</label><input id="pn">
      <button class="go" id="payb">أرسلت الدفع</button><div class="err" id="e3"></div>
    </div>
    <button class="alt" id="out2">تسجيل الخروج</button>
  </section>

  <section id="home" class="hide">
    <div class="card sw"><div><b id="who"></b><div class="mut" id="veh"></div></div><button class="tg" id="tg">غير متاح</button></div>
    <div class="err" id="e2"></div>
    <button class="alt" id="out">تسجيل الخروج</button>
    <div id="cur" class="card hide"></div>
    <div id="list"></div>
  </section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,addDoc,getDoc,updateDoc,onSnapshot,query,where,runTransaction,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyBmZP_ZaIOUiZeexQmtPlYVJENJYIk3iME",
  authDomain:"sindbad-13df0.firebaseapp.com",
  projectId:"sindbad-13df0",
  storageBucket:"sindbad-13df0.firebasestorage.app",
  messagingSenderId:"1088403371161",
  appId:"1:1088403371161:web:79fc720b3287ab77627408"
});
const auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const show=id=>["auth","reg","wait","home"].forEach(i=>$(i).classList.toggle("hide",i!==id));
const VN={car:"صالون",dafar:"دفار",box:"بوكس",rickshaw:"ركشة",bike:"موتر"};
const vlabel=x=>(VN[x.vehicleType]||"")+(x.vehicleType==="car"&&x.carModel?" "+x.carModel:"");
const RADIUS=1;
let uid,me=null,pos=null,watchId=null,unRides=null,unCur=null,rides=[],lastSent=0;

let unMe=null;
onAuthStateChanged(auth,u=>{
  if(unMe){unMe();unMe=null}
  if(!u||u.isAnonymous){uid=null;me=null;stopAll();if(unPay){unPay();unPay=null}show("auth");return}
  uid=u.uid;
  unMe=onSnapshot(doc(db,"drivers",uid),s=>{
    if(!s.exists()){show("reg");return}
    me=s.data();
    const exp=me.paidUntil&&me.paidUntil.toMillis()<Date.now();
    if(!me.active||exp){stopAll();showPay(exp);return}
    $("who").textContent=me.name;$("veh").textContent=vlabel(me)+" • "+me.plate;
    setBtn(!!me.online);show("home");
    me.online?goOnline():stopAll();
  });
});

let unPay=null,payCfg=null,curPrice=null;
async function showPay(exp){
  show("wait");
  $("wt").textContent=exp?"انتهى اشتراكك":"اشتراكك غير مفعّل";
  $("wm").textContent=exp?"جدد اشتراكك عشان تستلم الطلبات.":"ادفع الاشتراك الشهري عشان يتفعّل حسابك.";
  if(!payCfg){try{const s=await getDoc(doc(db,"settings","payment"));payCfg=s.exists()?s.data():{}}catch(e){payCfg={}}}
  const DEF={car:100000,rickshaw:50000,bike:20000,dafar:0,box:0},PK={car:"priceCar",rickshaw:"priceRickshaw",bike:"priceBike",dafar:"priceDafar",box:"priceBox"};
  curPrice=Number(payCfg[PK[me.vehicleType]])||DEF[me.vehicleType];
  if(!curPrice){$("pr").textContent="—";$("wm").textContent="تواصل مع الإدارة لمعرفة قيمة الاشتراك لنوع مركبتك.";$("pay").classList.add("hide");return}
  $("pr").textContent=curPrice.toLocaleString("en-US")+" جنيه ("+vlabel(me)+")";
  $("ba").textContent=payCfg.bankAccount||"تواصل مع الإدارة";$("bh").textContent=payCfg.holderName||"";
  if(unPay)unPay();
  unPay=onSnapshot(query(collection(db,"payments"),where("driverId","==",uid)),s=>{
    const p=s.docs.some(d=>d.data().status==="pending");
    $("pay").classList.toggle("hide",p);
    if(p)$("wm").textContent="استلمنا بيانات الدفع وبنراجعها، وبعدها يتفعّل حسابك.";
  });
}
$("payb").onclick=async()=>{
  const ref=$("rf").value.trim(),payer=$("pn").value.trim();
  if(!ref||payer.length<2){$("e3").textContent="اكتب رقم العملية واسم المحوِّل";return}
  try{await addDoc(collection(db,"payments"),{driverId:uid,driverName:me.name,driverPhone:me.phone,ref,payerName:payer,amount:curPrice,status:"pending",createdAt:serverTimestamp()});$("e3").textContent=""}
  catch(e){$("e3").textContent="فشل الإرسال، حاول تاني"}
};
let mode="login";
$("av").onchange=()=>$("mdl").classList.toggle("hide",$("av").value!=="car");
const norm=p=>{let x=String(p).replace(/\D/g,"");if(x.startsWith("249"))x="0"+x.slice(3);else if(x.length===9&&x[0]==="9")x="0"+x;return x};
$("am").onclick=()=>{
  mode=mode==="login"?"reg":"login";const r=mode==="reg";
  $("rg").classList.toggle("hide",!r);$("rg2").classList.toggle("hide",!r);
  $("at").textContent=r?"حساب سواق جديد":"دخول السواق";$("ab").textContent=r?"إنشاء الحساب":"دخول";
  $("am").textContent=r?"عندي حساب، دخول":"ما عندي حساب، سجّل جديد";$("e0").textContent="";
};
$("ab").onclick=async()=>{
  const ph=norm($("ap").value),pw=$("aw").value,email=ph+"@sindbad.invalid",er=$("e0");
  if(ph.length!==10||ph[0]!=="0"){er.textContent="اكتب رقم هاتف صاح (09XXXXXXXX)";return}
  if(pw.length<6){er.textContent="كلمة السر لازم 6 أحرف أو أرقام على الأقل";return}
  er.textContent="";$("ab").disabled=true;
  try{
    if(mode==="reg"){
      const name=$("an").value.trim(),plate=$("al").value.trim();
      if(name.length<2||!plate){er.textContent="اكتب الاسم ورقم اللوحة";return}
      const c=await createUserWithEmailAndPassword(auth,email,pw);
      await setDoc(doc(db,"drivers",c.user.uid),{name,phone:ph,plate,vehicleType:$("av").value,carModel:$("av").value==="car"?$("md").value:"",active:false,online:false,createdAt:serverTimestamp()});
    }else await signInWithEmailAndPassword(auth,email,pw);
    $("aw").value="";
  }catch(e){
    const m={"auth/email-already-in-use":"الرقم ده مسجل قبل كده، اضغط 'عندي حساب' وادخل","auth/invalid-credential":"الرقم أو كلمة السر غلط","auth/wrong-password":"الرقم أو كلمة السر غلط","auth/user-not-found":"الرقم أو كلمة السر غلط","auth/operation-not-allowed":"فعّل Email/Password في Firebase Authentication","auth/network-request-failed":"تأكد من الإنترنت","auth/too-many-requests":"محاولات كتيرة، استنى شوية وجرب تاني"};
    er.textContent=m[e.code]||"فشل، حاول تاني";
  }finally{$("ab").disabled=false}
};
async function logout(){
  try{if(uid){await setDoc(doc(db,"driverLocations",uid),{online:false,updatedAt:serverTimestamp()},{merge:true});await updateDoc(doc(db,"drivers",uid),{online:false})}}catch(e){}
  signOut(auth);
}
$("out").onclick=logout;$("out2").onclick=logout;
$("regb").onclick=async()=>{
  const name=$("nm").value.trim(),phone=$("ph").value.trim(),plate=$("pl").value.trim();
  if(name.length<2||phone.replace(/\D/g,"").length<9||!plate){$("e1").textContent="كمّل كل الخانات صاح";return}
  try{await setDoc(doc(db,"drivers",uid),{name,phone,plate,vehicleType:$("vt").value,active:false,online:false,createdAt:serverTimestamp()})}
  catch(e){$("e1").textContent="فشل التسجيل، حاول تاني"}
};

function setBtn(on){$("tg").textContent=on?"متاح":"غير متاح";$("tg").classList.toggle("on",on)}
$("tg").onclick=()=>{
  if(me.online)setDoc(doc(db,"driverLocations",uid),{online:false,updatedAt:serverTimestamp()},{merge:true}).catch(()=>{});
  updateDoc(doc(db,"drivers",uid),{online:!me.online});
};

function goOnline(){
  if(!navigator.geolocation){$("e2").textContent="المتصفح ما بدعم تحديد الموقع";return}
  const onPos=p=>{
    pos={lat:p.coords.latitude,lng:p.coords.longitude};$("e2").textContent="";render();
    if(Date.now()-lastSent>20000){lastSent=Date.now();updateDoc(doc(db,"drivers",uid),pos).catch(()=>{});setDoc(doc(db,"driverLocations",uid),{lat:pos.lat,lng:pos.lng,vehicleType:me.vehicleType,online:true,updatedAt:serverTimestamp()}).catch(()=>{})}
  };
  const onErr=()=>{$("e2").textContent="فعّل الـ GPS واسمح للمتصفح بالوصول للموقع"};
  if(watchId===null){
    render();
    navigator.geolocation.getCurrentPosition(onPos,()=>{},{enableHighAccuracy:false,timeout:15000,maximumAge:120000});
    watchId=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:10000});
  }
  if(!unRides)unRides=onSnapshot(query(collection(db,"rides"),where("status","==","pending"),where("vehicleType","==",me.vehicleType)),s=>{
    rides=s.docs.map(d=>({id:d.id,...d.data()}));render();
  });
}
function stopAll(){
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}
  if(unRides){unRides();unRides=null}rides=[];if($("list"))$("list").innerHTML="";
}

function km(a,b,c,d){const r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 12742*Math.asin(Math.sqrt(h))}
function render(){
  if(!me||!me.online)return;
  if(!pos){$("list").innerHTML='<div class="card mut">جاري تحديد موقعك... لو طولت اطلع لمكان مفتوح أو فعّل دقة الموقع العالية.</div>';return}
  const near=rides.map(r=>({...r,d:km(pos.lat,pos.lng,r.lat,r.lng)})).filter(r=>r.d<=RADIUS).sort((a,b)=>a.d-b.d);
  $("list").innerHTML=near.length?near.map(r=>`<div class="card"><div class="dist">${r.d.toFixed(1)} كم منك</div>${r.price?`<div><b>${Number(r.price).toLocaleString("en-US")} جنيه</b> • ${r.distanceKm} كم</div>`:""}<h2>${esc(r.customerName)}</h2><div class="mut">الوجهة: ${esc(r.destination)}</div><button class="ok" data-id="${r.id}">اقبل الطلب</button></div>`).join(""):`<div class="card mut">ما في طلبات في حدود كيلو منك هسه. خليك متاح وبتظهر هنا.</div>`;
  document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>accept(b.dataset.id));
}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

async function accept(id){
  const ref=doc(db,"rides",id);
  try{
    await runTransaction(db,async t=>{
      const s=await t.get(ref);
      if(!s.exists()||s.data().status!=="pending")throw new Error("taken");
      t.update(ref,{status:"accepted",driverId:uid,driverName:me.name,driverPhone:me.phone,driverVehicle:vlabel(me),driverPlate:me.plate,acceptedAt:serverTimestamp()});
    });
    track(id);
  }catch(e){$("e2").textContent=e.message==="taken"?"سواق تاني سبقك لهذا الطلب":"فشل قبول الطلب، حاول تاني";}
}
function track(id){
  if(unCur)unCur();
  unCur=onSnapshot(doc(db,"rides",id),s=>{
    const r=s.data();
    if(!r||r.status!=="accepted"){$("cur").classList.add("hide");if(unCur){unCur();unCur=null}return}
    $("cur").classList.remove("hide");
    $("cur").innerHTML=`<h2>مشوارك الحالي</h2><div><b>${esc(r.customerName)}</b></div><div class="mut">الوجهة: ${esc(r.destination)}</div>${r.price?`<div><b>${Number(r.price).toLocaleString("en-US")} جنيه</b> • ${r.distanceKm} كم</div>`:""}
      <a class="btn" href="tel:${encodeURIComponent(r.customerPhone)}">اتصل بالزبون</a>
      <a class="btn l" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${r.lat},${r.lng}">موقع الزبون في الخريطة</a>${r.destLat?`<a class="btn l" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${r.destLat},${r.destLng}">موقع الوجهة في الخريطة</a>`:""}
      <button class="alt" id="done">تم المشوار</button>`;
    $("done").onclick=()=>updateDoc(doc(db,"rides",id),{status:"done"});
  });
}
</script>
</body>
</html>
